[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videocap"
version = "0.2.0"
description = "Event-grounded video captioning with OpenAI-compatible models"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "jsonschema>=4.0.0",
  "openai>=1.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.12"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.12"]

[tool.uv]
default-groups = ["dev"]

[project.scripts]
videocap = "videocap.cli:main"

[tool.setuptools.packages.find]
include = ["videocap*"]

[tool.setuptools.package-data]
"videocap.schemas" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
