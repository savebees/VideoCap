# ── Model ──
vlm_model: "Qwen3.6-35B-A3B"
vllm_base_url: "http://localhost:8000/v1"

# ── Preprocessing (Step 0) ──
video_fps: 1.0
frame_quality: 95
frame_max_long_side: 672

# ── Dense Captioning (Step 3) ──
prefix_context_num: 3
min_description_words: 100
vlm_max_tokens_step3: 2048
max_retries_short_desc: 2

# ── Actions (Step 4) ──
min_action_duration: 0.5
vlm_max_tokens_step4: 4096

# ── Object Detection (Step 5) ──
detection_nms_threshold: 0.5            # intra-frame NMS: same label + IoU > this → drop duplicate
detection_cross_frame_iou: 0.85         # cross-frame clustering: any labels + IoU > this → same physical object
detection_confidence_floor: 0.3
vlm_max_tokens_step5: 4096

# ── VLM General ──
vlm_temperature: 0.7
vlm_max_tokens_step1: 8192
max_retries: 3
enable_thinking: false
vlm_top_p: 0.8
vlm_top_k: 20
vlm_presence_penalty: 1.5

# ── Paths ──
video_dir: "data/videos"
output_dir: "data/output"
