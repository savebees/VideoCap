# Physics-IQ Benchmark: fixed-camera tabletop physics experiments,
# 198 clips (take-1), 8 s each, 30 fps source, 3840x2160.
# Full copy of default.yaml; values that differ from default are marked [PIQ].

# ── Model ──
vlm_model: "Qwen3.6-35B-A3B"
vllm_base_url: "http://localhost:8000/v1"

# ── Dataset ──
dataset_type: "physics_iq"              # [PIQ] selects prompts/physics_iq.py

# ── Preprocessing ──
video_fps: 6.0                          # [PIQ] 30 fps source divides evenly: exactly every 5th frame,
                                        # strictly uniform intervals (0.167 s). Sub-second impacts and
                                        # releases get mid-event frames. 8 s x 6 fps = 48 frames per clip,
                                        # matching the eval judge's 48-frame sampling density.
frame_quality: 95
frame_max_long_side: 672

# ── Long-video Mode ──
# Clips are 8 s, far below the threshold; these values are inert but kept for completeness.
long_video_threshold_sec: 120
long_video_chunk_sec: 120

# ── Scene Segmentation ──
vlm_max_tokens_segmentation: 8192
vlm_temperature_segmentation: 0.2       # structured JSON: low temp for stable boundaries/timestamps
vlm_presence_penalty_segmentation: 0.5

# ── Dense Captioning ──
prefix_context_num: 3
min_description_words: 60               # [PIQ] a single experiment phase (setup at rest, event, aftermath)
                                        # carries less content than a 100-word general scene; forcing 100
                                        # words on a static-setup segment invites padding and fabrication.
vlm_max_tokens_captioning: 2048
max_retries_short_desc: 2
vlm_temperature_captioning: 0.7         # prose: keep diversity for rich descriptions
vlm_presence_penalty_captioning: 1.0

# ── Actions ──
min_action_duration: 0.2                # [PIQ] impacts, releases, and collisions are sub-second events;
                                        # the 0.5 s default filter would silently drop them after the
                                        # prompt explicitly asks for them.
vlm_max_tokens_actions: 4096
vlm_temperature_actions: 0.2            # structured JSON: low temp, no presence penalty
vlm_presence_penalty_actions: 0.0

# ── Object Detection ──
# Dedup is intra-frame only (two-pass NMS, keep larger box); there is no cross-frame dedup.
detection_nms_threshold: 0.5            # pass 1 — same label + IoU > this → drop duplicate
detection_cross_label_iou_threshold: 0.9  # pass 2 — near-identical boxes (different labels) IoU > this → same object, drop. High bar spares distinct overlaps (person vs the bag they hold)
vlm_max_tokens_detection: 2048
detection_concurrency: 32               # concurrent per-frame detection requests
vlm_temperature_detection: 0.0          # greedy for grounding
vlm_presence_penalty_detection: 0.0

# ── VLM General ──
max_retries: 3
enable_thinking: false
vlm_top_p: 0.8
vlm_top_k: 20

# ── Paths ──
video_dir: "/nfshdd/21039533r/zxhe/datasets/physics_iq/30FPS"   # [PIQ] the 198 take-1 30FPS clips
output_dir: "results/physics_iq"        # [PIQ] eval/config_physics_iq.yaml reads the `pipeline` and `a3b`
                                        # systems from this exact dir (annotation.json + baseline.json per
                                        # video_id), matching how NWPU sits in results/nwpu_campus/{split}.