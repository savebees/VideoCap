# Model
vlm_model: "Qwen3.6-35B-A3B"
vllm_base_url: "http://localhost:8000/v1"

# Dataset: selects the prompt set from prompts/ (override with --dataset_type)
dataset_type: "default"

# Preprocessing
video_fps: 1.0
frame_quality: 95
frame_max_long_side: 672

# Long-video mode
long_video_threshold_sec: 120
long_video_chunk_sec: 120

# Scene segmentation
vlm_max_tokens_segmentation: 8192
vlm_temperature_segmentation: 0.2
vlm_presence_penalty_segmentation: 0.5

# Dense captioning
prefix_context_num: 3
min_description_words: 100
min_description_words_surveillance: 30
vlm_max_tokens_captioning: 2048
max_retries_short_desc: 2
vlm_temperature_captioning: 0.7
vlm_presence_penalty_captioning: 1.0

# Actions
min_action_duration: 0.5
vlm_max_tokens_actions: 4096
vlm_temperature_actions: 0.2
vlm_presence_penalty_actions: 0.0

# Object detection: intra-frame two-pass NMS only, no cross-frame dedup
detection_nms_threshold: 0.5              # pass 1: same label
detection_cross_label_iou_threshold: 0.9  # pass 2: label drift; high bar spares real overlaps
vlm_max_tokens_detection: 2048
detection_concurrency: 32
vlm_temperature_detection: 0.0
vlm_presence_penalty_detection: 0.0

# VLM general
max_retries: 3
enable_thinking: false
vlm_top_p: 0.8
vlm_top_k: 20

# Paths
video_dir: "data/videos"
output_dir: "data/output"
