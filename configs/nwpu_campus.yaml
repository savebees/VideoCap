# NWPU Campus: fixed-camera campus surveillance footage.
# Full copy of default.yaml; values that differ from default are marked [NWPU].

# ── Model ──
vlm_model: "Qwen3.6-35B-A3B"
vllm_base_url: "http://localhost:8000/v1"

# ── Dataset ──
dataset_type: "nwpu_campus"             # [NWPU] selects prompts/nwpu_campus.py and forces
                                        # surveillance mode (fixed-chunk segmentation +
                                        # surveillance prompts) for every clip, regardless
                                        # of duration.

# ── Preprocessing ──
video_fps: 1.0
frame_quality: 95
frame_max_long_side: 672

# ── Long-video Mode ──
long_video_threshold_sec: 120
long_video_chunk_sec: 120

# ── Scene Segmentation ──
vlm_max_tokens_segmentation: 8192
vlm_temperature_segmentation: 0.2       # structured JSON: low temp for stable boundaries/timestamps
vlm_presence_penalty_segmentation: 0.5

# ── Dense Captioning ──
prefix_context_num: 3
min_description_words: 100
min_description_words_surveillance: 30   # lower bar: empty surveillance clips don't need 100 words
vlm_max_tokens_captioning: 2048
max_retries_short_desc: 2
vlm_temperature_captioning: 0.7         # prose: keep diversity for rich descriptions
vlm_presence_penalty_captioning: 1.0

# ── Actions ──
min_action_duration: 0.5
vlm_max_tokens_actions: 4096
vlm_temperature_actions: 0.2            # structured JSON: low temp, no presence penalty
vlm_presence_penalty_actions: 0.0

# ── Object Detection ──
# Dedup is intra-frame only (two-pass NMS, keep larger box); there is no cross-frame dedup.
detection_nms_threshold: 0.5            # pass 1 — same label + IoU > this → drop duplicate
detection_cross_label_iou_threshold: 0.9  # pass 2 — near-identical boxes (different labels) IoU > this → same object, drop. High bar spares distinct overlaps (person vs the bag they hold)
vlm_max_tokens_detection: 2048
detection_concurrency: 32               # concurrent per-frame detection requests
vlm_temperature_detection: 0.0          # greedy for grounding
vlm_presence_penalty_detection: 0.0

# ── VLM General ──
max_retries: 3
enable_thinking: false
vlm_top_p: 0.8
vlm_top_k: 20

# ── Paths ──
# [NWPU] Train and Test reuse the same 221 filenames and video_id is the basename, so a
# shared output_dir would make the second split read the first split's cached frames and
# segments. One config per split, each pointing at the dir eval/config.yaml reads that
# split from (results/nwpu_campus/{Test,Train}). This file is the Test split; copy it to
# configs/nwpu_campus_train.yaml with output_dir: results/nwpu_campus/Train for Train.
video_dir: "/nfshdd/21039533r/zxhe/datasets/nwpu_campus/NWPUCampusDataset/videos/Test"
output_dir: "results/nwpu_campus/Test"
