# A3B baseline on Physics-IQ. baseline.json lands beside the pipeline's
# annotation.json, where eval/config_physics_iq.yaml reads the a3b system.

vlm_model: "Qwen3.6-35B-A3B"
vllm_base_url: "http://localhost:8001/v1"

# 32 uniform frames = 4 fps over the 8 s clips, same budget as other datasets
num_frames: 32
frame_quality: 95
frame_max_long_side: 672

# Sampling params
vlm_temperature: 0.7
vlm_presence_penalty: 1.5
vlm_max_tokens: 2048
vlm_top_p: 0.8
vlm_top_k: 20
enable_thinking: false

# Paths
output_dir: "results/physics_iq"
